services:
  logger:
    build:
      context: ./
      dockerfile: ./Dockerfile
    env_file:
      - .env.docker
    environment:
      - APPLICATION_PORT=3000
    ports:
      - "${LOGGER_PORT:-3002}:${APPLICATION_PORT:-3000}"

  esp-db:
    image: postgres:16.3
    restart: always
    env_file:
      - .env.docker
    ports:
      - "${ESP_POSTGRES_PORT:-5433}:${POSTGRES_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
